name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check bin/cli.js
          node --check lib/render.js
          node --check lib/init.js

      - name: Render smoke test
        run: |
          RESET=$(( $(date +%s) + 15240 ))
          JSON="{\"rate_limits\":{\"five_hour\":{\"used_percentage\":39,\"resets_at\":$RESET},\"seven_day\":{\"used_percentage\":19}}}"
          OUT=$(printf '%s' "$JSON" | CC_STATUSLINE_LANG=en node bin/cli.js render)
          echo "Output: $OUT"
          echo "$OUT" | grep -q "5H"
          echo "$OUT" | grep -q "39%"
          echo "$OUT" | grep -q "7D"
          echo "$OUT" | grep -q "19%"
          echo "$OUT" | grep -qE '\([0-9]+h[0-9]+m\)'

      - name: Block-token segment smoke test
        run: |
          mkdir -p ~/.cache/cc-statusline
          printf '67809963' > ~/.cache/cc-statusline/blocktokens.txt
          JSON='{"session_id":"ci","rate_limits":{"five_hour":{"used_percentage":39},"seven_day":{"used_percentage":19}}}'
          OUT=$(printf '%s' "$JSON" | CC_STATUSLINE_LANG=en node bin/cli.js render)
          echo "Output: $OUT"
          echo "$OUT" | grep -q "🪙 67.8M"
          # The opt-out must suppress the segment even with a fresh cache present.
          OFF=$(printf '%s' "$JSON" | CC_STATUSLINE_LANG=en CC_STATUSLINE_NO_BLOCK_TOKENS=1 node bin/cli.js render)
          echo "Opt-out: $OFF"
          ! echo "$OFF" | grep -q "🪙"

      - name: Unit tests
        run: npm test

      - name: Init smoke test
        run: |
          TMP=$(mktemp -d)
          CLAUDE_CONFIG_DIR="$TMP" node bin/cli.js init
          grep -q '"statusLine"' "$TMP/settings.json"
          echo "init wrote statusLine OK"

      - name: Help and version
        run: |
          node bin/cli.js --version
          node bin/cli.js --help | head -1
